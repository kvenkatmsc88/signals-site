function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function unlock() {
  const pw  = document.getElementById("pw").value;
  const btn = document.getElementById("btn");
  if (!pw) return;

  btn.disabled    = true;
  btn.textContent = "Decrypting...";
  document.getElementById("err").style.display = "none";

  try {
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(pw),
      "PBKDF2",
      false,
      ["deriveKey"]
    );

    const key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: b64ToBytes(PAYLOAD.salt),
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(PAYLOAD.iv) },
      key,
      b64ToBytes(PAYLOAD.data)
    );

    const html = new TextDecoder().decode(decrypted);

    // Render decrypted report in full page
    document.getElementById("gate").style.display   = "none";
    document.body.style.display                     = "block";
    document.body.style.padding                     = "0";
    document.body.style.background                  = "#fafaf7";

    const iframe = document.getElementById("report");
    iframe.style.display = "block";
    iframe.style.height  = "100vh";
    iframe.srcdoc        = html;

    // Remember for this session
    sessionStorage.setItem("wk_unlocked", "1");

  } catch (e) {
    document.getElementById("err").style.display = "block";
    btn.disabled    = false;
    btn.textContent = "Decrypt & View";
  }
}

// Auto-unlock not stored (session-only — user must re-enter per tab)
</script>
